# Локальная разработка: только Postgres+PostGIS в Docker.
# API и web запускаются нативно (dotnet watch / npm run dev) ради hot reload.
services:
  db:
    image: postgis/postgis:17-3.5-alpine
    container_name: gameorg-local-db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=gameorg_local
      - POSTGRES_USER=gameorg
      - POSTGRES_PASSWORD=gameorg_local_dev_only
      - TZ=Asia/Baku
    ports:
      - "5434:5432" # 5433 занят нативным Postgres 15 на этой машине
    volumes:
      - gameorg-local-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gameorg -d gameorg_local"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  gameorg-local-data:
    driver: local
