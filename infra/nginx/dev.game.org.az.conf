server {
    listen 80;
    server_name dev.game.org.az;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name dev.game.org.az;

    ssl_certificate     /etc/ssl/cloudflare/webapp.game.org.az.pem;
    ssl_certificate_key /etc/ssl/cloudflare/webapp.game.org.az.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 10M;

    # /health у API — без префикса /api (как у текущего бота), а location /api/
    # ниже пробрасывает путь как есть. Отдельный location с явным путём в
    # proxy_pass, чтобы https://dev.game.org.az/api/health бил в /health бэкенда.
    location = /api/health {
        proxy_pass         http://127.0.0.1:3100/health;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass         http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass         http://127.0.0.1:3101;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
    }
}
